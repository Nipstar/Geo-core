[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antek-geo-core"
version = "0.3.1"
description = "Shared AI-visibility engine for Antek's GEO products (geo-slab + geo-prospecting)."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["antek_geo_core*"]
